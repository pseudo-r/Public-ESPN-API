version: '3.8'

# Infrastructure only — runs on Fedora server (192.168.1.XXX)
# PostgreSQL + Redis for local development on Mac

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=espn
      - POSTGRES_PASSWORD=espn
      - POSTGRES_DB=espn_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espn -d espn_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
