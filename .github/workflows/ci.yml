name: CI

on:
  push:
    branches: [Public-Api, main]
  pull_request:
    branches: [Public-Api, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: espn_service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: espn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d espn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/espn_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      CELERY_BROKER_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: espn_service/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint both services
        run: python -m ruff check . ../nhl_service

      - name: Test endpoint catalog parser
        working-directory: .
        run: python -m unittest discover -s scripts

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.test

      - name: Run PostgreSQL tests with required coverage
        run: python -m pytest tests/ --cov=apps --cov=clients --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --override-ini="addopts=" -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: espn_service/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  nhl-test:
    name: NHL service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nhl_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check Django and run tests
        run: |
          python manage.py check --settings=config.settings.test
          python -m pytest tests/ --cov=apps --cov=clients --cov-report=term --cov-fail-under=80 --override-ini="addopts=" -q

  docker-test:
    name: Docker and PostgreSQL integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: espn_service
    steps:
      - uses: actions/checkout@v4
      - name: Build and test application image
        run: docker compose -p espn-ci -f docker-compose.test.yml run --build --rm test
      - name: Stop disposable test containers
        if: always()
        run: docker compose -p espn-ci -f docker-compose.test.yml down

